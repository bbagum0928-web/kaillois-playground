<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카이와 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 어두운 오락실 화면 위에 도트 테두리 카드를 얹은 폰 한 화면 앱(480px). 선생님 순위판은 넓게. */
:root{
  --bg:#1D2B53;
  --panel:#FFF1E8;
  --ink:#1D2B53;
  --muted:#5F574F;
  --soft:#C2C3C7;
  --gold:#FFEC27;
  --c-agon:#FF004D;
  --c-alea:#FFA300;
  --c-mimicry:#29ADFF;
  --c-ilinx:#00E436;
  --t-agon:#FFC9D6;
  --t-alea:#FFE3A3;
  --t-mimicry:#C3E8FF;
  --t-ilinx:#BDF7C9;
  --f-display:'Jua','Noto Sans KR',sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --frame:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000;
  --bevel:inset -4px -4px 0 0 rgba(0,0,0,.22),inset 4px 4px 0 0 rgba(255,255,255,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.12) 1.5px,transparent 1.6px);background-size:24px 24px;color:var(--panel);font:400 16px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
body.wide #app{max-width:1000px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 14px;background:#000;color:var(--panel);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--c-agon) 25%,var(--c-alea) 0 50%,var(--c-mimicry) 0 75%,var(--c-ilinx) 0)}
.brand{font:400 20px var(--f-display);color:var(--gold)}
.prog{display:flex;gap:6px}
.prog i{width:14px;height:14px;border:2px solid var(--soft);background:transparent}
.prog i.on:nth-child(1){background:var(--c-agon);border-color:var(--c-agon)}
.prog i.on:nth-child(2){background:var(--c-alea);border-color:var(--c-alea)}
.prog i.on:nth-child(3){background:var(--c-mimicry);border-color:var(--c-mimicry)}
.prog i.on:nth-child(4){background:var(--c-ilinx);border-color:var(--c-ilinx)}
.hs{font:400 14px var(--f-display);color:var(--soft);white-space:nowrap}
.hs b{font-weight:400;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
main{flex:1;padding:22px 20px 28px;display:flex;flex-direction:column;gap:18px;--acc:var(--gold);--acc-ink:var(--ink);--tint:var(--panel)}
main.r0{--acc:var(--c-agon);--acc-ink:#fff;--tint:var(--t-agon)}
main.r1{--acc:var(--c-alea);--acc-ink:var(--ink);--tint:var(--t-alea)}
main.r2{--acc:var(--c-mimicry);--acc-ink:var(--ink);--tint:var(--t-mimicry)}
main.r3{--acc:var(--c-ilinx);--acc-ink:var(--ink);--tint:var(--t-ilinx)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:38px;color:var(--gold);text-shadow:3px 3px 0 #000}
h2{font-size:27px;color:var(--panel);text-shadow:2px 2px 0 #000}
h3{font-size:21px}
p{margin:0}
.lead{font-size:17px}
.meta{color:var(--soft);font-size:14px}
.card .meta{color:var(--muted)}
.kicker{font:400 17px var(--f-display);color:var(--soft)}
.press{font:400 15px var(--f-display);color:var(--c-ilinx);letter-spacing:.12em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.card{background:var(--panel);color:var(--ink);padding:16px;margin:4px;box-shadow:var(--frame),var(--bevel);display:flex;flex-direction:column;gap:10px}
.card h2,.card h3{color:var(--ink);text-shadow:none}
label{font-weight:700;font-size:15px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:500 17px var(--f-body);padding:10px 12px;border:0;margin:4px;background:#fff;color:var(--ink);box-shadow:var(--frame);border-radius:0;width:calc(100% - 8px);min-width:0}
textarea{font-size:14px;min-height:120px}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1;width:auto}
.btn{font:400 21px/1.2 var(--f-display);padding:14px 18px;margin:4px;border:0;background:var(--acc);color:var(--acc-ink);box-shadow:var(--frame),var(--bevel);cursor:pointer;touch-action:manipulation;text-shadow:none}
.btn:active{transform:translateY(4px);box-shadow:var(--frame)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.big{font-size:25px;padding:18px 20px;align-self:stretch}
.btn.sm{font-size:16px;padding:8px 12px;white-space:nowrap}
.btn:disabled{opacity:.5;transform:translateY(4px);box-shadow:var(--frame);cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.logo{display:flex;gap:14px;align-items:flex-end}
.logo .spr{display:block}
.iconrow{display:flex;align-items:center;gap:14px}
.tile{background:#000;padding:8px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--soft)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:r}
.rules li{counter-increment:r;display:flex;gap:12px;align-items:flex-start;background:var(--panel);color:var(--ink);margin:4px;padding:12px 14px;box-shadow:var(--frame);font-size:16.5px}
.rules li::before{content:counter(r);flex:none;width:30px;height:30px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:400 18px var(--f-display);box-shadow:0 0 0 3px #000}
.note{background:var(--tint);box-shadow:var(--frame);font-size:15px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
.player-badge{background:var(--acc);color:var(--acc-ink);padding:2px 12px;font:400 18px var(--f-display);box-shadow:0 0 0 3px #000}
.center{text-align:center;align-items:center}
.timebar{height:20px;margin:4px;background:#000;padding:4px;box-shadow:0 0 0 3px var(--soft)}
.timebar i{display:block;height:100%;width:100%;background:var(--acc)}
.total{font-family:var(--f-display);font-size:23px;font-weight:400;color:var(--gold)}
.combo{font:400 22px var(--f-display);color:var(--acc);min-width:84px;text-align:right}
.sky{position:relative;height:min(54vh,420px);min-height:300px;margin:4px;background-color:#0B1230;background-image:radial-gradient(#ffffff66 1px,transparent 1.5px);background-size:26px 26px;box-shadow:var(--frame);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.star{position:absolute;padding:0;border:0;background:none;animation:shrink 1.1s linear forwards;cursor:pointer;transition:transform .18s,opacity .18s}
.star .spr{width:100%;height:100%;display:block}
.star.caught{animation:none;transform:scale(1.7);opacity:0;pointer-events:none}
@keyframes shrink{from{transform:scale(1)}to{transform:scale(.3)}}
.floater{position:absolute;pointer-events:none;font:400 24px var(--f-display);color:var(--gold);text-shadow:2px 2px 0 #000;animation:rise .6s ease-out forwards}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.box{aspect-ratio:1;border:0;margin:4px;background:var(--acc);color:var(--acc-ink);font:400 38px var(--f-display);box-shadow:var(--frame),var(--bevel);cursor:pointer;display:grid;place-items:center;padding:4px;line-height:1.1}
.box .spr{width:72%;height:auto}
.box:disabled{cursor:default}
.box.shake{animation:shake .7s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.box.other{opacity:.6;font-size:23px;background:var(--panel);color:var(--ink);box-shadow:var(--frame)}
.box.chosen{font-size:26px;background:var(--panel);color:var(--ink)}
.box.gold{background:var(--gold);color:var(--ink)}
.box.dbl{background:var(--t-mimicry);color:var(--ink)}
.banner{background:var(--tint);color:var(--ink);margin:4px;padding:8px 12px;text-align:center;font-weight:700;box-shadow:var(--frame)}
.term{background:#050A14;color:#8DFFB9;margin:4px;padding:14px;font:500 16px/1.65 var(--f-body);display:flex;flex-direction:column;gap:8px;box-shadow:var(--frame),0 0 0 8px var(--soft)}
.term p{margin:0}
.term .tl{color:var(--gold);font:400 21px var(--f-display)}
.term .cur::after{content:"\2588";margin-left:3px;animation:blink 1s steps(1) infinite}
.topts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.topt{text-align:left;font:inherit;color:#8DFFB9;background:transparent;border:2px dashed #8DFFB9;padding:10px 12px;cursor:pointer}
.topt:hover:not(:disabled){background:#0F2A1D}
.topt.on{background:#12301F;border-style:solid}
.topt:disabled{cursor:default}
.story{color:#fff}
.verdict{color:var(--gold);font:400 22px var(--f-display)}
.hint{color:#9AD9B4;font-size:14px}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cls{text-align:left;font:inherit;background:var(--panel);color:var(--ink);border:0;margin:4px;padding:10px;box-shadow:var(--frame),var(--bevel);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cls b{font:400 23px var(--f-display)}
.cls small{color:var(--muted);font-size:13px;line-height:1.4}
.cls .tile{padding:6px}
.stage{--heat:0;height:290px;margin:4px;display:grid;place-items:center;background:color-mix(in srgb,var(--c-agon) calc(var(--heat) * 60%),#0B1230);box-shadow:var(--frame);overflow:hidden;position:relative}
.balloon{will-change:transform;line-height:0}
.balloon.gone{opacity:0;transition:opacity .2s}
.burst{position:absolute;font:400 70px var(--f-display);color:var(--gold);text-shadow:4px 4px 0 var(--c-agon);transform:rotate(-8deg)}
.burst[hidden]{display:none}
.live{position:absolute;top:10px;left:0;right:0;text-align:center;font:400 20px var(--f-display);color:var(--soft)}
.live b{font-size:46px;font-weight:400;color:var(--gold);text-shadow:3px 3px 0 #000}
.msg{min-height:26px;text-align:center;font-weight:700}
.holdbtn{margin:4px;padding:32px 20px;font:400 29px var(--f-display);border:0;background:var(--acc);color:var(--acc-ink);box-shadow:var(--frame),var(--bevel);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer;align-self:stretch}
.holdbtn.down{transform:translateY(4px);box-shadow:var(--frame);background:var(--c-agon);color:#fff}
.holdbtn:disabled{opacity:.5;cursor:not-allowed}
.scorebox{display:flex;align-items:baseline;gap:8px}
.scorebox .num{font:400 88px/1 var(--f-display);color:var(--gold);text-shadow:5px 5px 0 #000;font-variant-numeric:tabular-nums}
.scorebox span:last-child{font:400 30px var(--f-display)}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.bars li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.bars .lab{grid-column:1/3;display:flex;justify-content:space-between;gap:8px}
.bars .lab b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink)}
.bars .lab span{color:var(--muted);font-size:14px}
.track{height:22px;background:#000;padding:4px}
.track i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--bc) 0 10px,transparent 10px 12px)}
.val{font:400 21px var(--f-display);min-width:44px;text-align:right}
.bars .desc{grid-column:1/3;font-size:14px;color:var(--muted)}
.talk{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.codebox{font:400 30px var(--f-display);color:var(--gold);letter-spacing:.06em;text-align:center;background:#000;padding:12px;font-variant-numeric:tabular-nums}
.sst{min-height:24px;font-weight:700;font-size:15px}
.tgrid{display:grid;gap:22px}
@media (min-width:780px){.tgrid{grid-template-columns:350px 1fr;align-items:start}}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;background:var(--panel);color:var(--ink);margin:4px;padding:10px 12px;box-shadow:var(--frame),var(--bevel)}
.rk{width:40px;height:40px;display:grid;place-items:center;font:400 23px var(--f-display);background:#fff;box-shadow:0 0 0 3px #000}
.row.top1 .rk{background:var(--gold)}
.row.top2 .rk{background:#DCE3EE}
.row.top3 .rk{background:#F0C9A2}
.who b{font-size:17px}
.seg{display:flex;height:14px;background:#000;padding:3px;margin-top:4px}
.seg span{display:block;height:100%}
.tot{font:400 29px var(--f-display);font-variant-numeric:tabular-nums}
.x{border:0;width:32px;height:32px;background:#fff;color:var(--ink);font-size:18px;line-height:1;cursor:pointer;box-shadow:0 0 0 3px #000}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--soft)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;background:var(--k)}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.award{margin:4px;padding:10px 12px;background:var(--bg2);color:var(--ink);box-shadow:var(--frame)}
.award small{display:block;color:var(--muted)}
.award b{font:400 21px var(--f-display)}
.err{color:#B0003A;font-weight:700;min-height:24px}
.ok{color:#007A3D;font-weight:700}
.link{background:none;border:0;padding:6px 0;color:var(--soft);text-decoration:underline;font:inherit;cursor:pointer;align-self:center}
.empty{color:var(--soft);padding:20px;text-align:center;border:3px dashed var(--soft)}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.qrbox{background:#fff;padding:10px;align-self:flex-start;box-shadow:var(--frame);margin:4px;line-height:0}
.qrbox svg{width:210px;height:210px;display:block}
.roomcode{font:400 40px var(--f-display);color:var(--ink);letter-spacing:.14em}
@media (prefers-reduced-motion:reduce){
  .star,.floater,.box.shake,.press,.term .cur::after{animation:none}
  .btn,.balloon.gone,.star.caught{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="brand">카이와 놀이터</span>
    <span class="prog" id="prog" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="hs">SCORE <b id="hs">00000</b></span>
  </header>
  <main id="main"></main>
</div>
<script src="vendor/qrcode.js"></script>
<script>
(function(){
'use strict';

var main=document.getElementById('main');
var blocks=document.getElementById('prog').children;
var hsEl=document.getElementById('hs');

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n,w){var s=String(n);while(s.length<w)s='0'+s;return s;}
function $(s){return document.querySelector(s);}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function cleanRoom(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);}
var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var timers=[],raf=0;
function T(fn,ms){var id=setTimeout(fn,ms);timers.push(id);return id;}
function I(fn,ms){var id=setInterval(fn,ms);timers.push(id);return id;}
function clearAll(){timers.forEach(function(id){clearTimeout(id);clearInterval(id);});timers=[];cancelAnimationFrame(raf);raf=0;}
function sum(a){return a.reduce(function(x,y){return x+y;},0);}

/* ---------- 도트 그림 ---------- */
var PAL={k:'#000000',w:'#FFF1E8',y:'#FFEC27',o:'#FFA300',r:'#FF004D',b:'#29ADFF',d:'#1D2B53',g:'#00E436',n:'#AB5236',p:'#FF77A8',s:'#C2C3C7',l:'#83769C',t:'#FFCCAA'};
function spr(rows,map,px){
  var w=rows[0].length,h=rows.length,s='';
  for(var y=0;y<h;y++){var x=0;while(x<w){var c=rows[y][x];if(c==='.'){x++;continue;}var x2=x;while(x2<w&&rows[y][x2]===c)x2++;
    s+='<rect x="'+x+'" y="'+y+'" width="'+(x2-x)+'" height="1" fill="'+((map&&map[c])||PAL[c]||'#000')+'"/>';x=x2;}}
  return '<svg class="spr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'"'+(px?' width="'+w*px+'" height="'+h*px+'"':'')+' shape-rendering="crispEdges" aria-hidden="true">'+s+'</svg>';
}
var STAR=['....y....','....y....','...yyy...','yyyyyyyyy','.yyyyyyy.','..yyyyy..','..yyyyy..','.yyy.yyy.','.yy...yy.'];
var CHEST=['.kkkkkkkk.','knnnnnnnnk','knnnnnnnnk','kkkkyykkkk','knnnyynnnk','knnnnnnnnk','knnnnnnnnk','.kkkkkkkk.'];
var SWORD=['...s...','..sws..','..sws..','..sws..','..sws..','..sws..','.kkkkk.','...n...','...n...','...y...'];
var BALLOON=['..rrrr..','.rwwrrr.','rrwrrrrr','rrwrrrrr','rrrrrrrr','rrrrrrrr','.rrrrrr.','..rrrr..','...rr...','....k...'];
var HERO_ROUND=['...HHHH...','..HHHHHH..','.HHHHHHHH.','.HttttttH.','.HtkttktH.','..tttttt..','..BBBBBB..','.CCCBBCCC.','.CCCCCCCC.','.CC....CC.'];
var HERO_POINTY=['....HH....','...HHHH...','..HHHHHH..','.HHHHHHHH.','HHHHHHHHHH','..tttttt..','..tktktt..','..tttttt..','..BBBBBB..','.CCCCCCCC.'];
var ROUND_ICONS=[spr(STAR,null,8),spr(CHEST,null,8),spr(SWORD,null,8),spr(BALLOON,null,8)];

/* ---------- 데이터 ---------- */
var EL=[
  {key:'agon',name:'경쟁 요소',game:'별똥별 잡기',desc:'실력과 노력으로 겨루는 재미'},
  {key:'alea',name:'확률 요소',game:'행운 상자',desc:'운에 맡기는 두근두근'},
  {key:'mimicry',name:'역할 요소',game:'던전 글자 모험',desc:'다른 직업이 되어 모험하는 재미'},
  {key:'ilinx',name:'스릴 요소',game:'풍선 버티기',desc:'아슬아슬하고 짜릿한 느낌'}
];

var ROUNDS=[
  {title:'별똥별 잡기',rules:['30초 동안 별이 계속 나타나요','별을 연속으로 잡으면 콤보! 한 개마다 점수가 더 올라가요','반짝이는 주황 황금 별은 20점이에요'],note:'빠른 손가락과 집중력이 필요해요!',play:playStar},
  {title:'행운 상자',rules:['상자 3개 중 하나를 골라요','숫자, 황금 카드, 더블 카드가 숨어 있어요','모두 6번 골라요'],note:'어떤 상자가 좋을지는 아무도 몰라요. 열어 봐야 알아요!',play:playBox},
  {title:'던전 글자 모험',rules:['직업을 하나 골라요: 전사, 마법사, 드워프, 엘프, 도적, 성직자','던전에서 6번 위기를 만나요. 행동을 하나씩 골라요','상황 속 단서를 잘 읽고, 내 직업에 어울리는 행동을 골라야 높은 점수예요'],note:'직업의 능력은 알려 주지 않아요. 설명을 잘 읽고 신중하게 정해요. 옛날 컴퓨터 통신 시절의 글자 게임이에요.',play:playRole},

function updateHeader(n){

function myId(){var k='kaillois-id',v=0;try{v=+localStorage.getItem(k);}catch(e){}
  if(!(v>=1&&v<=9999)){v=rnd(1,9999);try{localStorage.setItem(k,String(v));}catch(e){}}return v;}
function clamp3(n){return Math.max(0,Math.min(999,Math.round(n)));}
function chk(d14){var s=0;for(var i=0;i<d14.length;i++){s+=(+d14[i])*(i+1);}return s%10;}
function makeCode(no,sc){var d=pad(no,4)+pad(clamp3(sc[0]),3)+pad(clamp3(sc[1]),3)+pad(clamp3(sc[2]),3)+pad(clamp3(sc[3]),3);var c=d+chk(d);
  return c.slice(0,4)+' '+c.slice(4,7)+' '+c.slice(7,10)+' '+c.slice(10,13)+' '+c.slice(13,16)+' '+c.slice(16);}
function parseCode(s){
  var d=String(s).replace(/\D/g,'');
  if(d.length!==17)return {err:'숫자 17개가 필요해요. 띄어쓰기는 있어도 괜찮아요.'};
  if(chk(d.slice(0,16))!==+d[16])return {err:'확인 숫자가 맞지 않아요. 한 자리씩 다시 확인해요.'};
  var team=+d.slice(0,4);var sc=[4,7,10,13].map(function(i){return +d.slice(i,i+3);});
  if(team<1)return {err:'코드가 올바르지 않아요. 다시 확인해요.'};
  return {team:team,sc:sc};
}

function call(method,qs,body,pin){

  return fetch(API+(qs||''),{method:method,headers:{'content-type':'application/json','x-teacher-pin':pin||''},body:body?JSON.stringify(body):undefined,cache:'no-store',signal:ctl?ctl.signal:undefined})

          function(e){clearTimeout(to);throw e;});
}

function playStar(){
  var DUR=30000,pts=[0],caught=[0],turn=0,spawned=0,bestCombo=0;
  function turnIntro(){
    clearAll();
    main.innerHTML='<div class="center card">'+
     '<h2>준비되면 눌러요</h2>'+
     '<p>30초 동안 나타나는 별을 눌러 잡아요.<br>연속으로 잡으면 콤보!</p>'+
     '<button class="btn big" id="rdy" type="button">준비됐어요</button></div>';
    $('#rdy').onclick=runTurn;
  }
  function runTurn(){
    clearAll();
    main.innerHTML='<div class="hud"><span class="player-badge">별똥별</span><span>점수 <b id="sc" class="total">0</b></span><span class="combo" id="cb"></span></div>'+
     '<div class="timebar"><i id="tb"></i></div><div class="sky" id="sky"></div>';
    var area=$('#sky'),tb=$('#tb'),scEl=$('#sc'),cbEl=$('#cb');
    var count=0,score=0,combo=0,end=performance.now()+DUR,over=false;
    function hud(){scEl.textContent=score;cbEl.textContent=combo>=2?'콤보 x'+combo:'';}
    function floater(x,y,txt){var f=document.createElement('span');f.className='floater';f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';area.appendChild(f);T(function(){f.remove();},650);}
    function spawn(){
      if(over||end-performance.now()<800)return;
      spawned++;
      var gold=Math.random()<0.12,s=gold?76:rnd(52,68),life=gold?950:1100;
      var b=document.createElement('button');b.type='button';b.className='star';b.setAttribute('aria-label',gold?'황금 별':'별');
      b.innerHTML=spr(STAR,gold?{y:'#FFA300'}:null);
      var w=Math.max(area.clientWidth-s,1),h=Math.max(area.clientHeight-s,1),x=Math.random()*w,y=Math.random()*h;
      b.style.width=s+'px';b.style.height=s+'px';b.style.left=x+'px';b.style.top=y+'px';b.style.animationDuration=life+'ms';
      function hit(ev){
        if(ev)ev.preventDefault();if(b.dataset.done||over)return;b.dataset.done='1';
        combo++;if(combo>bestCombo)bestCombo=combo;count++;
        var p=gold?20:5+Math.min(combo,5);score+=p;hud();floater(x,y,'+'+p);
        b.classList.add('caught');T(function(){b.remove();},220);
      }
      b.addEventListener('pointerdown',hit);b.addEventListener('click',hit);
      area.appendChild(b);
      T(function(){if(!b.dataset.done){b.dataset.done='1';combo=0;hud();b.remove();}},life);
      T(spawn,rnd(420,760));
    }
    hud();spawn();
    var tick=I(function(){
      var left=Math.max(0,end-performance.now());
      tb.style.width=(left/DUR*100)+'%';
      if(left<=0){
        over=true;clearInterval(tick);pts[turn]=score;caught[turn]=count;
        finishRound(0,pts[0],'별 '+spawned+'개 중 '+caught[0]+'개를 잡았어요. 최고 콤보 '+bestCombo+'!');
      }
    },80);
  }
  turnIntro();
}

var TABLE=[[0,.12],[10,.18],[20,.22],[30,.18],[40,.12],[60,.06],[100,.04],['x2',.08]];
function draw(){var r=Math.random(),a=0;for(var i=0;i<TABLE.length;i++){a+=TABLE[i][1];if(r<a)return TABLE[i][0];}return 20;}
function boxLabel(v){return v==='x2'?'더블 ×2':(v===100?'황금 +100':'+'+v);}
function playBox(){
  var TURNS=6,n=0,total=0,mult=1;
  function turn(){
    clearAll();
    main.innerHTML='<div class="hud"><span class="player-badge">행운</span><span>'+(n+1)+' / '+TURNS+'번째</span><span class="total">합계 '+total+'</span></div>'+
     (mult===2?'<div class="banner">더블 찬스! 이번 선택은 점수가 2배예요</div>':'')+
     '<h2>상자를 하나 골라요</h2>'+
     '<div class="boxes">'+[0,1,2].map(function(i){return '<button class="box" type="button" data-i="'+i+'" aria-label="상자 '+(i+1)+'">'+spr(CHEST)+'</button>';}).join('')+'</div>'+
     '<p class="msg" id="msg" aria-live="polite"></p><div id="act"></div>';
    $$('.box').forEach(function(b){b.onclick=function(){pick(+b.dataset.i);};});
  }
  function pick(i){
    var vals=[draw(),draw(),draw()],boxes=$$('.box');
    boxes.forEach(function(b){b.disabled=true;});
    boxes[i].classList.add('shake');
    $('#msg').textContent='두근두근…';
    T(function(){
      boxes.forEach(function(b,k){
        b.classList.add(k===i?'chosen':'other');b.textContent=boxLabel(vals[k]);
        if(vals[k]===100)b.classList.add('gold');
        if(vals[k]==='x2')b.classList.add('dbl');
      });
      var v=vals[i],m=$('#msg'),num=function(x){return x==='x2'?0:x;},best=Math.max(num(vals[0]),num(vals[1]),num(vals[2]));
      n++;
      if(v==='x2'){
        if(n>=TURNS){total+=40;m.textContent='마지막 더블 카드는 보너스 +40점으로 바뀌었어요!';}
        else{mult=2;m.textContent='더블 카드! 다음 선택은 점수가 2배예요!';}
      }else{
        var gain=v*mult;total+=gain;
        m.textContent=(mult===2?'더블 적용! +'+gain+'점! ':'')+(v===100?'황금 카드! 대박이에요!':(num(v)===best&&v>0?'가장 좋은 상자를 골랐어요!':(v===0?'아쉬워요, 0점이에요.':'다른 상자가 더 컸어요. 운이에요!')));
        mult=1;
      }
      $('#act').innerHTML='<button class="btn big" id="nx" type="button">'+(n>=TURNS?'결과 보기':'다음 상자')+'</button>';
      $('#nx').onclick=function(){if(n>=TURNS)finishRound(1,total,'여섯 번 열어서 모은 점수예요.');else turn();};
    },reduced?0:750);
  }
  turn();
}

/* ---------- 라운드 4: 풍선 버티기 (꾸욱 눌렀다 떼기) ---------- */
function playBalloon(){
  var N=5,k=0,bank=0;
  function pts(x){return Math.round(x*160)+(x>=0.8?40:0);}
  function round(){
    clearAll();
    var pop=0.25+Math.random()*0.75,speed=0.22+Math.random()*0.12;
    var s=0,holding=false,over=false,last=0;
    main.innerHTML='<div class="hud"><span class="player-badge">풍선</span><span>풍선 '+(k+1)+' / '+N+'</span><span class="total">저금 '+bank+'</span></div>'+
     '<div class="stage" id="st"><div class="live">지금 손을 떼면<br><b id="lv">0</b>점</div><div class="balloon" id="bl">'+spr(BALLOON,null,9)+'</div><div class="burst" id="bu" hidden>펑!</div></div>'+
     '<p class="msg" id="msg" aria-live="polite">버튼을 꾸욱 누르고 있어요.</p>'+
     '<div id="act" style="display:flex;flex-direction:column"><button class="holdbtn" id="hold" type="button">꾸욱~ 눌러서 풍선 불기</button></div>';
    var st=$('#st'),bl=$('#bl'),bu=$('#bu'),lv=$('#lv'),msg=$('#msg'),btn=$('#hold');
    function paint(t){
      bl.style.transform='scale('+(1+s*1.6).toFixed(3)+') rotate('+(Math.sin(t/45)*s*7).toFixed(2)+'deg)';
      st.style.setProperty('--heat',s.toFixed(2));lv.textContent=pts(s);
    }
    function toNext(){
      btn.disabled=true;
      $('#act').innerHTML='<button class="btn big" id="nx" type="button">'+(k>=N?'결과 보기':'다음 풍선')+'</button>';
      $('#nx').onclick=function(){if(k>=N)finishRound(3,bank,'풍선 '+N+'개에서 저금한 점수예요.');else round();};
    }
    function frame(t){
      if(!holding||over)return;
      var dt=Math.min(0.05,(t-last)/1000);last=t;s+=dt*speed;
      if(s>=pop){
        over=true;holding=false;btn.classList.remove('down');
        bl.classList.add('gone');bu.hidden=false;lv.textContent=0;
        msg.textContent='펑!! 이 풍선은 0점이에요. 조금만 일찍 뗄 걸!';k++;
        try{if(navigator.vibrate)navigator.vibrate(120);}catch(e){}
        toNext();return;
      }
      paint(t);
      msg.textContent=s<0.35?'아직 괜찮아요…':(s<0.6?'점점 커져요. 언제 뗄까요?':(s<0.8?'아슬아슬해요!':'너무 위험해요!!'));
      raf=requestAnimationFrame(frame);
    }
    function down(e){
      if(over||holding)return;
      holding=true;last=performance.now();btn.classList.add('down');btn.textContent='누르는 중! 손을 떼면 저금!';
      try{if(e&&e.pointerId!==undefined)btn.setPointerCapture(e.pointerId);}catch(err){}
      raf=requestAnimationFrame(frame);
    }
    function up(){
      if(!holding)return;
      holding=false;cancelAnimationFrame(raf);btn.classList.remove('down');btn.textContent='꾸욱~ 눌러서 풍선 불기';
      if(over)return;
      if(s<0.03){msg.textContent='조금 더 꾸욱 눌러 봐요!';return;}
      over=true;var p=pts(s);bank+=p;k++;
      var left=Math.round((pop-s)*100);
      msg.textContent='저금 성공! +'+p+'점 · 터지기까지 '+left+'% 남았어요'+(left<=10?' (아슬아슬 세이프!)':'');
      toNext();
    }
    btn.addEventListener('pointerdown',function(e){e.preventDefault();down(e);});
    btn.addEventListener('pointerup',up);
    btn.addEventListener('pointercancel',up);
    btn.addEventListener('pointerleave',up);
    btn.addEventListener('contextmenu',function(e){e.preventDefault();});
    btn.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();down(e);}});
    btn.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();up();}});
    paint(0);
  }
  round();
}

    var s=$('#srv');if(!s)return;
    s.className=tmode==='server'?'ok':'meta';
    s.textContent=tmode==='server'?'서버 연결됨 · 3초마다 자동으로 새로 고쳐요':'서버 저장을 쓸 수 없어요. 아래 \'결과 코드로 직접 추가\'로 입력하면 이 브라우저에 저장돼요.';
  }
  function poll(){
    var r=troom;
    call('GET','?room='+r).then(function(j){if(r!==troom)return;tmode='server';rows=j.rows||[];setStatus();drawBoard();},
      function(){if(r!==troom)return;tmode='local';rows=load();setStatus();drawBoard();});
  }
  function startRoom(){
    troom=cleanRoom($('#room').value)||randRoom();$('#room').value=troom;
    try{localStorage.setItem(RKEY,troom);}catch(e){}
    showRoom();poll();
  }
  $('#setroom').onclick=startRoom;
  $('#room').addEventListener('input',function(){this.value=cleanRoom(this.value);});
  $('#pin').addEventListener('input',function(){tpin=this.value;});
  startRoom();I(poll,3000);

  function add(){
    var p=parseCode($('#code').value),m=$('#msg');m.className='err';
    if(p.err){m.textContent=p.err;return;}
    var name=$('#tname').value.trim()||('참가자'+p.team);
    function done(){m.className='ok';m.textContent=name+' 추가 완료!';$('#code').value='';$('#tname').value='';$('#code').focus();drawBoard();}
    if(tmode==='server'){
      call('POST','',{room:troom,team:p.team,name:name,sc:p.sc}).then(function(){poll();done();},function(e){m.textContent='서버에 저장하지 못했어요: '+e.message;});
    }else{
      var l=load().filter(function(r){return r.team!==p.team;});l.push({team:p.team,name:name,sc:p.sc});save(l);rows=l;done();
    }
  }
  $('#add').onclick=add;
  $('#code').addEventListener('keydown',function(e){if(e.key==='Enter')add();});
  $('#tname').addEventListener('keydown',function(e){if(e.key==='Enter')add();});
  var armed=false;
  $('#clr').onclick=function(){
    var b=$('#clr');
    if(!armed){armed=true;b.textContent='정말 지울까요? 한 번 더 누르세요';T(function(){armed=false;b.textContent='전체 지우기';},4000);return;}
    armed=false;b.textContent='전체 지우기';
    if(tmode==='server'){call('DELETE','?room='+troom,null,tpin).then(poll,function(e){$('#msg').className='err';$('#msg').textContent='지우지 못했어요: '+e.message;});}
    else{save([]);rows=[];drawBoard();}
  };
  $('#copy').onclick=function(){
    var text=tableText();var area=$('#copyarea');
    function fallback(){area.innerHTML='<label for="ct">아래 글을 복사해서 스프레드시트에 붙여 넣어요</label><textarea id="ct" readonly></textarea>';var t=$('#ct');t.value=text;t.focus();t.select();}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){area.innerHTML='<p class="ok">복사했어요! 스프레드시트에 붙여 넣으세요.</p>';},fallback);
      }else fallback();
    }catch(e){fallback();}
  };
  $('#back').onclick=function(){location.hash='';};
}

function ranked(){
  return rows.map(function(r){return {team:r.team,name:r.name,sc:r.sc,total:sum(r.sc)};})
    .sort(function(a,b){return b.total-a.total||a.team-b.team;});
}
function rankOf(list,r){return 1+list.filter(function(o){return o.total>r.total;}).length;}
function tableText(){
  var list=ranked();
  var out=['순위\t별명\t'+EL.map(function(e){return e.name;}).join('\t')+'\t합계'];
  list.forEach(function(r){out.push([rankOf(list,r),r.name].concat(r.sc).concat([r.total]).join('\t'));});
  return out.join('\n');
}

function drawBoard(){
  var box=$('#board'),aw=$('#awards');if(!box)return;
  if(!rows.length){box.innerHTML='<div class="empty">아직 입력된 학생이 없어요.</div>';aw.innerHTML='';return;}
  var list=ranked(),maxT=Math.max.apply(null,list.map(function(r){return r.total;}))||1;
  box.innerHTML='<ol class="board">'+list.map(function(r){
    var rank=rankOf(list,r);
    return '<li class="row'+(rank<=3?' top'+rank:'')+'"><span class="rk">'+rank+'</span>'+
     '<div class="who"><b>'+esc(r.name)+'</b><div class="seg">'+r.sc.map(function(s,i){return '<span style="width:'+(s/maxT*100)+'%;background:var(--c-'+EL[i].key+')"></span>';}).join('')+'</div></div>'+
     '<span class="tot">'+r.total+'</span><button class="x" type="button" data-del="'+r.team+'" aria-label="'+esc(r.name)+' 지우기">×</button></li>';
  }).join('')+'</ol>';
  $$('#board [data-del]').forEach(function(b){
    b.onclick=function(){
      var t=+b.dataset.del;
      if(tmode==='server'){call('DELETE','?room='+troom+'&team='+t,null,tpin).then(function(){return call('GET','?room='+troom);}).then(function(j){rows=j.rows||[];drawBoard();},
        function(e){var m=$('#msg');if(m){m.className='err';m.textContent='지우지 못했어요: '+e.message;}});}
      else{rows=rows.filter(function(r){return r.team!==t;});save(rows);drawBoard();}
    };
  });
  var titles=['경쟁왕','행운왕','역할왕','스릴왕'],bg=['t-agon','t-alea','t-mimicry','t-ilinx'];
  aw.innerHTML='<div class="awards">'+EL.map(function(e,i){
    var mx=Math.max.apply(null,list.map(function(r){return r.sc[i];}));
    var names=list.filter(function(r){return r.sc[i]===mx;}).map(function(r){return esc(r.name);}).join(', ');
    return '<div class="award" style="--bg2:var(--'+bg[i]+')"><small>'+titles[i]+' · '+e.game+' '+mx+'점</small><b>'+names+'</b></div>';
  }).join('')+'</div>';
}

/* ---------- 시작 ---------- */
function route(){if(location.hash==='#teacher')teacher();else start();}
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
